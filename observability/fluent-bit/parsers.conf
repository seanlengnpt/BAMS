[PARSER]
    Name         bams_logback
    Format       regex
    Regex        ^(?<_msg>(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?<thread>[^\]]+)\] (?<level>\S+)\s+(?<logger>\S+) - (?<message>.*))$
    Time_Key     timestamp
    Time_Format  %Y-%m-%d %H:%M:%S.%L

[PARSER]
    Name         admin_message_consumed
    Format       regex
    Regex        ^Consumed admin message\. topic=(?<topic>[^,]+), msgId=(?<msgId>[^,]+), adminId=(?<adminId>[^,]+), eventId=(?<eventId>.+)$
