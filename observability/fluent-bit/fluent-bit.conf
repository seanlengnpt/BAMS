[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name               tail
    Path               log/data.log
    Tag                bams.data
    Refresh_Interval   5
    Read_from_Head     true
    DB                 /tmp/fluent-bit-bams.db
    DB.Sync            Normal
    Mem_Buf_Limit      10MB
    Skip_Long_Lines    On

[FILTER]
    Name          parser
    Match         bams.data
    Key_Name      log
    Parser        bams_logback
    Reserve_Data  On

[FILTER]
    Name          grep
    Match         bams.data
    Regex         logger AdminMessageConsumer$

[FILTER]
    Name          grep
    Match         bams.data
    Regex         message ^Consumed admin message\.

[FILTER]
    Name          parser
    Match         bams.data
    Key_Name      message
    Parser        admin_message_consumed
    Reserve_Data  On

[FILTER]
    Name          modify
    Match         bams.data
    Add           app bams
    Add           source fluent-bit
    Add           pipeline admin-message

[OUTPUT]
    Name          http
    Match         bams.data
    Host          ${VICTORIALOGS_HOST}
    Port          ${VICTORIALOGS_PORT}
    URI           /insert/jsonline?_msg_field=log
    Format        json_lines
    Json_date_key timestamp
    Json_date_format iso8601
    Header        Content-Type application/stream+json

[OUTPUT]
    Name          stdout
    Match         bams.data
    Format        json_lines
