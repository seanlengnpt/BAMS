databaseName: bams_learning

dataSources:
  ds:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/bams_learning?useSSL=false&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true
    username: bams
    password: bams

rules:
  - !SHARDING
    tables:
      customers:
        actualDataNodes: ds.customers_$->{0..9}
        tableStrategy:
          standard:
            shardingColumn: account_number
            shardingAlgorithmName: customers_inline

    shardingAlgorithms:
      customers_inline:
        type: INLINE
        props:
          algorithm-expression: customers_$->{account_number.substring(account_number.length() - 1)}

props:
  sql-show: true