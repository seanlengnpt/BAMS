spring:
  application:
    name: BAMS
  datasource:
    url: jdbc:mysql://localhost:3306/bams_learning
    username: bams
    password: bams


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.shopee.banking.bams.infra.dal.dataObject
  configuration:
    map-underscore-to-camel-case: true

bams:
  auth:
    jwt:
      secret: local-development-bams-auth-secret-change-me
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
