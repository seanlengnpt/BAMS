spring:
  application:
    name: BAMS

  datasource:
    url: jdbc:mysql://localhost:3306/bams_learning?useSSL=false&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true
    username: bams
    password: bams
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.shopee.banking.bams.infra.dal.dataObject
  configuration:
    map-underscore-to-camel-case: true

bams:
  auth:
    jwt:
      secret: local-development-bams-auth-secret-change-me
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  mq:
    admin-message:
      consumer-enabled: true
      topic: bams-admin-message-topic
      consumer-group: bams-admin-message-consumer

logging:
  level:
    root: INFO
    org.springframework.jdbc: DEBUG
    org.mybatis: DEBUG
    org.apache.shardingsphere: DEBUG
    com.zaxxer.hikari: DEBUG

rocketmq:
  name-server: localhost:9876
  producer:
    group: bams-admin-message-producer


